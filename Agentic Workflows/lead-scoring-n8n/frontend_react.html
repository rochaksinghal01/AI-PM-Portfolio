<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lead Scoring — Upload &amp; Review (React)</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1115; color: #e8e8ea; margin: 0; padding: 32px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #9a9aa2; font-size: 13px; margin-bottom: 28px; }
  .card { background: #181a20; border: 1px solid #2a2d36; border-radius: 10px; padding: 20px; margin-bottom: 24px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  input[type=file] { color: #e8e8ea; }
  select { background: #1f222a; color: #e8e8ea; border: 1px solid #2a2d36; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  button { background: #4f7cff; color: white; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  button:hover { background: #3d67e0; }
  button.secondary { background: #2a2d36; }
  button.secondary:hover { background: #363a46; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; table-layout: fixed; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a2d36; vertical-align: top; word-wrap: break-word; }
  th { color: #9a9aa2; font-weight: 500; }
  .tier { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .tier-Hot { background: #4a1f1f; color: #ff8a8a; }
  .tier-Warm { background: #4a3d1f; color: #ffcf6b; }
  .tier-Cold { background: #1f2c4a; color: #8ab4ff; }
  .status-msg { font-size: 13px; margin-top: 10px; }
  .status-ok { color: #7dd88a; }
  .status-err { color: #ff8a8a; }
  .note { font-size: 12px; color: #7a7a84; margin-top: 8px; }
  .empty { color: #7a7a84; font-size: 13px; padding: 12px 0; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar label { font-size: 13px; color: #9a9aa2; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// ---- Configuration -------------------------------------------------------
const SUPABASE_URL = "https://fcbkjasbexttbivcgveq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_OEaf0d91p9b7OxmCht05Rg_nUkyo_8P";
const N8N_WEBHOOK_URL = "https://rochal10.app.n8n.cloud/webhook/leads-upload";
// ---------------------------------------------------------------------------

function escapeHtml(s) {
  return String(s == null ? '' : s);
}

function supaHeaders(extra) {
  return Object.assign({
    apikey: SUPABASE_PUBLISHABLE_KEY,
    Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
  }, extra || {});
}

function UploadPanel({ onUploaded }) {
  const [file, setFile] = useState(null);
  const [status, setStatus] = useState({ text: '', kind: '' });
  const [busy, setBusy] = useState(false);

  const handleUpload = async () => {
    if (!file) { setStatus({ text: 'Choose a CSV file first.', kind: 'err' }); return; }
    setBusy(true);
    setStatus({ text: 'Reading file...', kind: '' });
    try {
      const text = await file.text();
      setStatus({ text: 'Sending to n8n...', kind: '' });
      const res = await fetch(N8N_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ csv: text }),
      });
      if (!res.ok) throw new Error(`n8n responded ${res.status}: ${await res.text()}`);
      setStatus({ text: `Sent. n8n responded ${res.status} -- check the execution log, then refresh the queue below.`, kind: 'ok' });
      onUploaded();
    } catch (e) {
      setStatus({ text: `Failed: ${e.message}. If this is a CORS error, check the Webhook node's Allowed Origins.`, kind: 'err' });
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="card">
      <h2>1. Upload leads CSV</h2>
      <div className="toolbar">
        <input type="file" accept=".csv" onChange={(e) => setFile(e.target.files[0])} />
        <button disabled={busy} onClick={handleUpload}>Send to n8n</button>
      </div>
      {status.text && <div className={`status-msg ${status.kind === 'ok' ? 'status-ok' : status.kind === 'err' ? 'status-err' : ''}`}>{status.text}</div>}
      <div className="note">Posts to the n8n production webhook. The workflow must be active.</div>
    </div>
  );
}

function ReviewQueue({ refreshKey }) {
  const [rows, setRows] = useState([]);
  const [status, setStatus] = useState({ text: '', kind: '' });
  const [tierFilter, setTierFilter] = useState('all');
  const [scopeFilter, setScopeFilter] = useState('needsReview');

  const load = useCallback(async () => {
    setStatus({ text: 'Loading...', kind: '' });
    try {
      const params = new URLSearchParams();
      params.set('order', 'processed_at.desc');
      params.set('select', 'lead_id,name,company,tier,total_score,review_reason,summary,status,needs_human_review');
      if (scopeFilter === 'needsReview') params.set('needs_human_review', 'eq.true');
      if (tierFilter !== 'all') params.set('tier', `eq.${tierFilter}`);
      const url = `${SUPABASE_URL}/rest/v1/leads_scored?${params.toString()}`;
      const res = await fetch(url, { headers: supaHeaders() });
      if (!res.ok) throw new Error(`Supabase responded ${res.status}: ${await res.text()}`);
      const data = await res.json();
      setRows(data);
      setStatus({ text: `Loaded ${data.length} row(s).`, kind: 'ok' });
      console.log('[ReviewQueue] loaded', data.length, 'rows', { tierFilter, scopeFilter });
    } catch (e) {
      setStatus({ text: `Failed: ${e.message}. If this is a 401/permission error, check RLS on leads_scored.`, kind: 'err' });
      console.error('[ReviewQueue] load failed', e);
    }
  }, [tierFilter, scopeFilter]);

  useEffect(() => { load(); }, [load, refreshKey]);

  const resolve = async (leadId) => {
    try {
      const url = `${SUPABASE_URL}/rest/v1/leads_scored?lead_id=eq.${encodeURIComponent(leadId)}`;
      const res = await fetch(url, {
        method: 'PATCH',
        headers: supaHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify({ needs_human_review: false, status: 'ok' }),
      });
      if (!res.ok) throw new Error(`Supabase responded ${res.status}: ${await res.text()}`);
      load();
    } catch (e) {
      alert(`Could not resolve ${leadId}: ${e.message}`);
    }
  };

  return (
    <div className="card">
      <h2>2. Human review queue</h2>
      <div className="toolbar">
        <button className="secondary" onClick={load}>Refresh</button>
        <label>Tier</label>
        <select value={tierFilter} onChange={(e) => setTierFilter(e.target.value)}>
          <option value="all">All tiers</option>
          <option value="Hot">Hot</option>
          <option value="Warm">Warm</option>
          <option value="Cold">Cold</option>
        </select>
        <label>Scope</label>
        <select value={scopeFilter} onChange={(e) => setScopeFilter(e.target.value)}>
          <option value="needsReview">Needs review only</option>
          <option value="all">All processed leads</option>
        </select>
      </div>
      {status.text && <div className={`status-msg ${status.kind === 'ok' ? 'status-ok' : status.kind === 'err' ? 'status-err' : ''}`}>{status.text}</div>}
      {rows.length === 0 ? (
        <div className="empty">Nothing matches this filter.</div>
      ) : (
        <table>
          <colgroup>
            <col style={{ width: '14%' }} /><col style={{ width: '12%' }} /><col style={{ width: '10%' }} />
            <col style={{ width: '20%' }} /><col style={{ width: '32%' }} /><col style={{ width: '12%' }} />
          </colgroup>
          <thead>
            <tr><th>Lead</th><th>Company</th><th>Tier</th><th>Reason</th><th>Summary</th><th></th></tr>
          </thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.lead_id}>
                <td>{escapeHtml(r.lead_id)}<br /><span style={{ color: '#7a7a84' }}>{escapeHtml(r.name || '')}</span></td>
                <td>{escapeHtml(r.company || '-')}</td>
                <td><span className={`tier tier-${r.tier}`}>{escapeHtml(r.tier)} ({r.total_score})</span></td>
                <td>{escapeHtml(r.review_reason || '-')}</td>
                <td>{escapeHtml(r.summary) || <span style={{ color: '#7a7a84' }}>(no summary — LLM call failed or was rate-limited for this lead)</span>}</td>
                <td>
                  {r.needs_human_review ? (
                    <button className="secondary" onClick={() => resolve(r.lead_id)}>Mark reviewed</button>
                  ) : (
                    <span style={{ color: '#7dd88a', fontSize: '12px' }}>resolved</span>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function App() {
  const [refreshKey, setRefreshKey] = useState(0);
  return (
    <div>
      <h1>Lead Scoring — Upload &amp; Review</h1>
      <div className="sub">React version. Upload a leads CSV to n8n, review/filter what's been flagged for a human.</div>
      <UploadPanel onUploaded={() => setRefreshKey((k) => k + 1)} />
      <ReviewQueue refreshKey={refreshKey} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
